version: "3.9"

# Panic Plan - one command deploy.
#   docker compose up -d --build
# App:    http://localhost:8080
# API:    http://localhost:4000/api/health
# IdP:    http://localhost:8081 (TideCloak admin: admin / password)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: panicplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panicplan}
      POSTGRES_DB: panicplan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panicplan -d panicplan"]
      interval: 5s
      timeout: 5s
      retries: 12

  tidecloak:
    image: tideorg/tidecloak-dev:latest
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${TIDECLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TIDECLOAK_ADMIN_PASSWORD:-password}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./server/tidecloak:/opt/keycloak/data/import:ro
      - tidecloak-data:/opt/keycloak/data
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/panicplan HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      tidecloak:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://panicplan:${POSTGRES_PASSWORD:-panicplan}@db:5432/panicplan?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      COOKIE_NAME: pp_session
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      APP_URL: ${APP_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Panic Plan <no-reply@panicplan.local>}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # The browser must reach the authorization endpoint over a public URL,
      # while the server talks to TideCloak over the internal network.
      TIDECLOAK_ISSUER: ${TIDECLOAK_ISSUER:-http://localhost:8081/realms/panicplan,http://tidecloak:8080/realms/panicplan}
      TIDECLOAK_AUTHORIZATION_ENDPOINT: ${TIDECLOAK_AUTHORIZATION_ENDPOINT:-http://localhost:8081/realms/panicplan/protocol/openid-connect/auth}
      TIDECLOAK_TOKEN_ENDPOINT: ${TIDECLOAK_TOKEN_ENDPOINT:-http://tidecloak:8080/realms/panicplan/protocol/openid-connect/token}
      TIDECLOAK_USERINFO_ENDPOINT: ${TIDECLOAK_USERINFO_ENDPOINT:-http://tidecloak:8080/realms/panicplan/protocol/openid-connect/userinfo}
      TIDECLOAK_JWKS_URI: ${TIDECLOAK_JWKS_URI:-http://tidecloak:8080/realms/panicplan/protocol/openid-connect/certs}
      TIDECLOAK_CLIENT_ID: ${TIDECLOAK_CLIENT_ID:-panicplan-web}
      TIDECLOAK_CLIENT_SECRET: ${TIDECLOAK_CLIENT_SECRET:-}
      TIDECLOAK_REDIRECT_URI: ${TIDECLOAK_REDIRECT_URI:-http://localhost:8080/auth/callback}
      TIDECLOAK_AUDIENCE: ${TIDECLOAK_AUDIENCE:-panicplan-web}
      MEME_API_URL: ${MEME_API_URL:-https://api.memegen.link}
      MEME_ENABLED: ${MEME_ENABLED:-true}
    ports:
      - "4000:4000"

  seed:
    profiles: ["seed"]
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://panicplan:${POSTGRES_PASSWORD:-panicplan}@db:5432/panicplan?schema=public
      NODE_ENV: production
    command: ["node", "dist-seed/seed.js"]

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  pgdata:
  tidecloak-data:
